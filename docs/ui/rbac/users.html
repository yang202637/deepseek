<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>辰光Agent平台 — 用户管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0F172A; --navy-light: #1E293B; --navy-muted: #334155;
    --amber: #F59E0B; --amber-light: #FEF3C7;
    --bg: #F8FAFC; --surface: #FFFFFF;
    --border: #E2E8F0; --border-light: #F1F5F9;
    --text: #0F172A; --text-muted: #64748B; --text-faint: #94A3B8;
    --red: #EF4444; --red-bg: #FEE2E2; --green: #10B981; --green-bg: #D1FAE5;
    --blue: #3B82F6; --blue-bg: #DBEAFE; --purple: #8B5CF6; --purple-bg: #EDE9FE;
    --radius: 8px; --radius-sm: 6px;
    --sidebar-w: 240px; --topbar-h: 56px;
  }
  body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

  /* ===== Sidebar ===== */
  .sidebar { width: var(--sidebar-w); background: var(--navy); height: 100vh; position: fixed; left: 0; top: 0; display: flex; flex-direction: column; z-index: 100; overflow-y: auto; }
  .sidebar-logo { padding: 20px 20px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--navy-muted); }
  .sidebar-logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--amber), #D97706); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--navy); flex-shrink: 0; }
  .sidebar-logo-text { font-size: 14px; font-weight: 600; color: #F1F5F9; letter-spacing: -0.2px; line-height: 1.3; }
  .sidebar-logo-text small { display: block; font-size: 10px; font-weight: 400; color: #64748B; }
  .sidebar-nav { padding: 12px 0; flex: 1; }
  .nav-section { padding: 8px 20px 4px; font-size: 10px; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: 0.8px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; color: #94A3B8; text-decoration: none; font-size: 13px; font-weight: 400; transition: all 0.15s; cursor: pointer; border-left: 3px solid transparent; }
  .nav-item:hover { color: #CBD5E1; background: rgba(255,255,255,0.04); }
  .nav-item.active { color: var(--amber); background: rgba(245,158,11,0.08); border-left-color: var(--amber); font-weight: 500; }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }
  .nav-item.active svg { opacity: 1; }
  .nav-divider { height: 1px; background: var(--navy-muted); margin: 8px 20px; }
  .sidebar-user { padding: 16px 20px; border-top: 1px solid var(--navy-muted); display: flex; align-items: center; gap: 10px; }
  .sidebar-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--amber), #D97706); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--navy); flex-shrink: 0; }
  .sidebar-user-info { flex: 1; min-width: 0; }
  .sidebar-username { font-size: 13px; font-weight: 600; color: #F1F5F9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-role { font-size: 11px; color: #64748B; }
  .sidebar-logout { background: none; border: none; color: #64748B; cursor: pointer; padding: 4px; border-radius: 4px; }
  .sidebar-logout:hover { color: var(--red); background: rgba(239,68,68,0.1); }

  /* ===== Main ===== */
  .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { height: var(--topbar-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 28px; gap: 16px; position: sticky; top: 0; z-index: 50; }
  .topbar-breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
  .topbar-breadcrumb a { color: var(--text-muted); text-decoration: none; }
  .topbar-breadcrumb a:hover { color: var(--text); }
  .topbar-breadcrumb .sep { color: var(--text-faint); }
  .topbar-breadcrumb .current { color: var(--text); font-weight: 500; }
  .topbar-spacer { flex: 1; }
  .topbar-perm-badge { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: #FEF3C7; border: 1px solid #FDE68A; border-radius: 20px; font-size: 11px; font-weight: 500; color: #92400E; }
  .topbar-perm-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }

  .content { flex: 1; padding: 28px; }
  .page-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
  .page-header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; color: var(--text); }
  .page-header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .page-header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  /* ===== Stats ===== */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; position: relative; overflow: hidden; }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .stat-card.blue::before { background: var(--blue); }
  .stat-card.green::before { background: var(--green); }
  .stat-card.red::before { background: var(--red); }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
  .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.8px; line-height: 1; }

  /* ===== Card / Table ===== */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .card-header h2 { font-size: 14px; font-weight: 600; flex: 1; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .search-box { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; }
  .search-box input { border: none; background: none; outline: none; font-size: 13px; font-family: inherit; color: var(--text); width: 180px; }
  .search-box input::placeholder { color: var(--text-faint); }
  .filter-select { padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; color: var(--text-muted); background: var(--surface); outline: none; cursor: pointer; transition: border-color 0.15s; }
  .filter-select:focus { border-color: var(--amber); }

  table { width: 100%; border-collapse: collapse; }
  thead th { padding: 10px 20px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text-muted); background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody td { padding: 12px 20px; font-size: 13px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #FAFBFC; }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
  .badge-green { background: var(--green-bg); color: #065F46; }
  .badge-blue { background: var(--blue-bg); color: #1E40AF; }
  .badge-amber { background: var(--amber-light); color: #92400E; }
  .badge-red { background: var(--red-bg); color: #991B1B; }
  .badge-gray { background: #F1F5F9; color: #64748B; }

  .auth-tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); font-family: 'Inter', monospace; font-weight: 500; white-space: nowrap; }
  .auth-tag.all { background: var(--amber-light); color: #92400E; border-color: #FDE68A; }
  .auth-tag.super { background: var(--blue-bg); color: #1E40AF; border-color: #BFDBFE; }

  .user-cell { display: flex; align-items: center; gap: 10px; }
  .user-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .avatar-blue { background: linear-gradient(135deg, #3B82F6, #1D4ED8); }
  .avatar-green { background: linear-gradient(135deg, #10B981, #047857); }
  .avatar-purple { background: linear-gradient(135deg, #8B5CF6, #6D28D9); }
  .avatar-amber { background: linear-gradient(135deg, #F59E0B, #D97706); }
  .avatar-rose { background: linear-gradient(135deg, #F43F5E, #BE123C); }
  .avatar-cyan { background: linear-gradient(135deg, #06B6D4, #0E7490); }

  .role-pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .role-pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }

  .row-actions { display: flex; align-items: center; gap: 2px; white-space: nowrap; }
  .btn-link { background: none; color: var(--blue); padding: 5px 8px; font-size: 12px; text-decoration: none; border: none; cursor: pointer; font-family: inherit; border-radius: 4px; transition: background 0.15s; }
  .btn-link:hover { background: var(--blue-bg); }
  .btn-link.danger { color: var(--red); }
  .btn-link.danger:hover { background: var(--red-bg); }
  .btn-link.muted { color: var(--text-muted); }
  .btn-link.muted:hover { background: #F1F5F9; }

  /* ===== Buttons ===== */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: inherit; transition: all 0.15s; text-decoration: none; }
  .btn svg { width: 14px; height: 14px; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { background: var(--navy-light); }
  .btn-secondary { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--text-faint); color: var(--text); }

  /* ===== Pagination ===== */
  .pagination { padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }
  .pagination-pages { display: flex; gap: 4px; }
  .page-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-muted); font-size: 13px; cursor: pointer; text-decoration: none; font-family: inherit; transition: all 0.15s; }
  .page-btn:hover:not(:disabled) { border-color: var(--text-faint); color: var(--text); }
  .page-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ===== Modal ===== */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 200; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius); width: 480px; max-width: 90vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25); animation: modalIn 0.18s ease; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .modal-header { padding: 18px 24px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-header h3 { font-size: 16px; font-weight: 600; }
  .modal-close { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; font-size: 16px; border-radius: 4px; transition: all 0.15s; }
  .modal-close:hover { background: #F1F5F9; color: var(--text); }
  .modal-body { padding: 22px 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
  .form-group { margin-bottom: 16px; }
  .form-group:last-child { margin-bottom: 0; }
  .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .form-group label .req { color: var(--red); margin-left: 2px; }
  .form-group label .hint { font-weight: 400; color: var(--text-faint); font-size: 12px; }
  .form-group input, .form-group select { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; color: var(--text); background: var(--surface); transition: border-color 0.15s, box-shadow 0.15s; outline: none; }
  .form-group input:focus, .form-group select:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,0.1); }
  .form-hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  /* Chip 多选（角色） */
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; color: var(--text-muted); cursor: pointer; transition: all 0.15s; user-select: none; }
  .chip input { display: none; }
  .chip:hover { border-color: var(--text-faint); }
  .chip.checked { border-color: var(--amber); background: var(--amber-light); color: #92400E; font-weight: 500; }
  .chip.disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== Toast ===== */
  .toast-container { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 300; }
  .toast { padding: 12px 18px; border-radius: var(--radius-sm); font-size: 13px; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.18); display: flex; align-items: center; gap: 8px; animation: toastIn 0.25s ease; max-width: 360px; }
  .toast.success { background: #065F46; }
  .toast.error { background: #991B1B; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

  /* ===== Empty state ===== */
  .empty-state { text-align: center; padding: 56px 16px; color: var(--text-muted); }
  .empty-state .empty-icon { font-size: 36px; margin-bottom: 12px; }
  .empty-state .empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .empty-state .empty-desc { font-size: 13px; }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .stats-row { grid-template-columns: 1fr; }
    .sidebar { width: 64px; }
    .sidebar-logo-text, .nav-section, .sidebar-user-info { display: none; }
    .main { margin-left: 64px; }
  }
</style>
</head>
<body>

<!-- ===== Sidebar ===== -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">辰</div>
    <div class="sidebar-logo-text">辰光 Agent<small>Chenguang Platform</small></div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">概览</div>
    <a class="nav-item" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      工作台
    </a>
    <div class="nav-divider"></div>
    <div class="nav-section">系统管理</div>
    <a class="nav-item active" href="users.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      用户管理
    </a>
    <a class="nav-item" href="roles.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      角色管理
    </a>
    <a class="nav-item" href="permissions.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      权限管理
    </a>
  </nav>
  <div class="sidebar-user">
    <div class="sidebar-avatar">A</div>
    <div class="sidebar-user-info">
      <div class="sidebar-username">admin</div>
      <div class="sidebar-role">超管 · 数据范围: all</div>
    </div>
    <button class="sidebar-logout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</aside>

<!-- ===== Main ===== -->
<div class="main">
  <div class="topbar">
    <div class="topbar-breadcrumb">
      <a href="dashboard.html">工作台</a>
      <span class="sep">/</span>
      <a href="#">系统管理</a>
      <span class="sep">/</span>
      <span class="current">用户管理</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-perm-badge"><span class="topbar-perm-dot"></span>超管模式</div>
  </div>

  <div class="content">
    <div class="page-header">
      <div>
        <h1>用户管理</h1>
        <p>管理系统用户账号、分配角色与数据访问范围。仅超管可访问。</p>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-primary" onclick="openCreateModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新增用户
        </button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card blue">
        <div class="stat-label">用户总数</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">活跃用户</div>
        <div class="stat-value" style="color:var(--green)" id="stat-active">0</div>
      </div>
      <div class="stat-card red">
        <div class="stat-label">已禁用</div>
        <div class="stat-value" style="color:var(--red)" id="stat-disabled">0</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>用户列表</h2>
        <div class="toolbar">
          <div class="search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search" placeholder="搜索用户名/邮箱...">
          </div>
          <select class="filter-select" id="role-filter">
            <option value="">全部角色</option>
            <option value="超管">超管</option>
            <option value="运营人员">运营人员</option>
            <option value="普通用户">普通用户</option>
          </select>
          <select class="filter-select" id="status-filter">
            <option value="">全部状态</option>
            <option value="active">活跃</option>
            <option value="disabled">已禁用</option>
          </select>
        </div>
      </div>
      <div class="card-body">
        <table>
          <thead>
            <tr>
              <th>用户</th>
              <th>邮箱</th>
              <th>角色</th>
              <th>数据范围</th>
              <th>状态</th>
              <th>最后登录</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="user-tbody"></tbody>
        </table>
        <div class="pagination">
          <span id="total-info">共 0 条</span>
          <div class="pagination-pages">
            <button class="page-btn" id="prev-btn" disabled>‹</button>
            <span class="page-btn active" id="page-indicator">1</span>
            <button class="page-btn" id="next-btn" disabled>›</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 新增/编辑用户弹窗 ===== -->
<div class="modal-overlay" id="modal-user">
  <div class="modal">
    <div class="modal-header">
      <h3 id="user-modal-title">新增用户</h3>
      <button class="modal-close" onclick="closeModal('user')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>用户名 <span class="req">*</span> <span class="hint">（英文，唯一，用于登录）</span></label>
        <input type="text" id="f-username" placeholder="例如: zhaoliu" maxlength="50">
      </div>
      <div class="form-group">
        <label>邮箱 <span class="req">*</span></label>
        <input type="email" id="f-email" placeholder="例如: zhaoliu@chenguang.ai">
      </div>
      <div class="form-group" id="password-group">
        <label>初始密码 <span class="req">*</span> <span class="hint">（至少 8 位）</span></label>
        <input type="password" id="f-password" placeholder="请设置初始密码">
      </div>
      <div class="form-group">
        <label>分配角色</label>
        <div class="chip-group" id="f-role-chips">
          <label class="chip"><input type="checkbox" value="运营人员">运营人员（data_scope: all）</label>
          <label class="chip"><input type="checkbox" value="普通用户">普通用户（data_scope: self）</label>
          <label class="chip disabled"><input type="checkbox" value="超管" disabled>超管（系统保留）</label>
        </div>
        <div class="form-hint">角色决定功能权限与数据访问范围；可多选</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('user')">取消</button>
      <button class="btn btn-primary" id="user-submit-btn" onclick="submitUser()">创建用户</button>
    </div>
  </div>
</div>

<!-- ===== 重置密码弹窗 ===== -->
<div class="modal-overlay" id="modal-password">
  <div class="modal">
    <div class="modal-header">
      <h3>重置密码</h3>
      <button class="modal-close" onclick="closeModal('password')">✕</button>
    </div>
    <div class="modal-body">
      <div style="margin-bottom:16px;padding:12px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border);font-size:13px;color:var(--text-muted);">
        正在重置用户 <strong id="pw-username" style="color:var(--text);">—</strong> 的密码
      </div>
      <div class="form-group">
        <label>新密码 <span class="req">*</span> <span class="hint">（至少 8 位）</span></label>
        <input type="password" id="f-new-password" placeholder="请输入新密码">
      </div>
      <div class="form-group">
        <label>确认密码 <span class="req">*</span></label>
        <input type="password" id="f-confirm-password" placeholder="请再次输入新密码">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('password')">取消</button>
      <button class="btn btn-primary" onclick="submitPassword()">确认重置</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
/* ===== 数据 ===== */
const ROLES = {
  '超管':   { scope: 'all', system: true },
  '运营人员': { scope: 'all', system: false },
  '普通用户': { scope: 'self', system: false },
};

const AVATAR_COLORS = ['avatar-blue', 'avatar-green', 'avatar-purple', 'avatar-amber', 'avatar-rose', 'avatar-cyan'];

let users = [
  { id: 1, username: 'admin',    email: 'admin@chenguang.ai',    roles: ['超管'],   status: 'active',   lastLogin: '2026-10-25 17:30', superuser: true },
  { id: 2, username: 'zhangsan', email: 'zhangsan@chenguang.ai', roles: ['普通用户'], status: 'active',   lastLogin: '2026-10-24 09:15', superuser: false },
  { id: 3, username: 'lisi',     email: 'lisi@chenguang.ai',     roles: ['运营人员', '普通用户'], status: 'active', lastLogin: '2026-10-25 14:22', superuser: false },
  { id: 4, username: 'wangwu',   email: 'wangwu@chenguang.ai',   roles: ['普通用户'], status: 'disabled', lastLogin: '2026-10-10 11:00', superuser: false },
  { id: 5, username: 'zhaoliu',  email: 'zhaoliu@chenguang.ai',  roles: ['运营人员'], status: 'active',   lastLogin: '2026-10-23 16:40', superuser: false },
  { id: 6, username: 'sunqi',    email: 'sunqi@chenguang.ai',    roles: ['普通用户'], status: 'active',   lastLogin: '2026-10-22 10:05', superuser: false },
  { id: 7, username: 'zhouba',   email: 'zhouba@chenguang.ai',   roles: ['普通用户'], status: 'disabled', lastLogin: '2026-09-30 08:12', superuser: false },
  { id: 8, username: 'wujiu',    email: 'wujiu@chenguang.ai',    roles: ['运营人员'], status: 'active',   lastLogin: '2026-10-21 13:55', superuser: false },
  { id: 9, username: 'zhengshi', email: 'zhengshi@chenguang.ai', roles: ['普通用户'], status: 'active',   lastLogin: '2026-10-20 09:30', superuser: false },
  { id: 10, username: 'qianyi',  email: 'qianyi@chenguang.ai',   roles: ['普通用户'], status: 'active',   lastLogin: '2026-10-19 15:20', superuser: false },
];

const PAGE_SIZE = 5;
let currentPage = 1;
let filtered = [];
let editingId = null;
let resettingId = null;

/* ===== 工具函数 ===== */
function getScope(u) {
  if (u.superuser) return 'super';
  if (u.roles.some(r => ROLES[r] && ROLES[r].scope === 'all')) return 'all';
  return 'self';
}
function scopeTag(u) {
  const s = getScope(u);
  if (s === 'super') return '<span class="auth-tag super">all · 锁定</span>';
  if (s === 'all') return '<span class="auth-tag all">all</span>';
  return '<span class="auth-tag">self</span>';
}
function statusBadge(s) {
  return s === 'active'
    ? '<span class="badge badge-green">活跃</span>'
    : '<span class="badge badge-red">已禁用</span>';
}
function rolePills(roles) {
  return roles.map(r => {
    let cls = 'badge-gray';
    if (r === '超管') cls = 'badge-blue';
    else if (r === '运营人员') cls = 'badge-amber';
    return `<span class="role-pill ${cls}">${r}</span>`;
  }).join('');
}
function avatarClass(id) { return AVATAR_COLORS[id % AVATAR_COLORS.length]; }
function initial(u) { return (u.username || '?').charAt(0).toUpperCase(); }

function toast(msg, type = 'success') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span><span>${msg}</span>`;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 2400);
}

/* ===== 渲染 ===== */
function applyFilters() {
  const term = document.getElementById('search').value.toLowerCase();
  const role = document.getElementById('role-filter').value;
  const status = document.getElementById('status-filter').value;
  filtered = users.filter(u =>
    (!term || u.username.toLowerCase().includes(term) || u.email.toLowerCase().includes(term)) &&
    (!role || u.roles.includes(role)) &&
    (!status || u.status === status)
  );
}

function updateStats() {
  document.getElementById('stat-total').textContent = users.length;
  document.getElementById('stat-active').textContent = users.filter(u => u.status === 'active').length;
  document.getElementById('stat-disabled').textContent = users.filter(u => u.status === 'disabled').length;
}

function render() {
  applyFilters();
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
  currentPage = Math.min(currentPage, totalPages);
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);

  document.getElementById('total-info').textContent = `共 ${filtered.length} 条`;
  document.getElementById('page-indicator').textContent = `${currentPage} / ${totalPages}`;
  document.getElementById('prev-btn').disabled = currentPage <= 1;
  document.getElementById('next-btn').disabled = currentPage >= totalPages;
  updateStats();

  const tbody = document.getElementById('user-tbody');
  if (page.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">
      <div class="empty-icon">👤</div>
      <div class="empty-title">未找到匹配的用户</div>
      <div class="empty-desc">调整搜索关键词或筛选条件，或新增一个用户</div>
    </div></td></tr>`;
    return;
  }

  tbody.innerHTML = page.map(u => {
    const isSelf = u.superuser;
    return `<tr${isSelf ? ' style="background:#F8FAFC;"' : ''}>
      <td>
        <div class="user-cell">
          <div class="user-avatar ${avatarClass(u.id)}">${initial(u)}</div>
          <div>
            <div style="font-weight:${isSelf ? '600' : '500'};">${u.username}</div>
            <div style="font-size:11px;color:var(--text-faint);">ID: ${u.id}</div>
          </div>
        </div>
      </td>
      <td>${u.email}</td>
      <td><div class="role-pills">${rolePills(u.roles)}</div></td>
      <td>${scopeTag(u)}</td>
      <td>${statusBadge(u.status)}</td>
      <td style="color:var(--text-muted);font-size:12px;">${u.lastLogin}</td>
      <td>
        <div class="row-actions">
          ${isSelf
            ? '<span style="color:var(--text-faint);font-size:11px;">当前账号</span>'
            : `
              <button class="btn-link" onclick="openEditModal(${u.id})">编辑</button>
              <button class="btn-link muted" onclick="openPasswordModal(${u.id})">重置密码</button>
              <button class="btn-link muted" onclick="toggleStatus(${u.id})">${u.status === 'active' ? '禁用' : '启用'}</button>
              <button class="btn-link danger" onclick="deleteUser(${u.id})">删除</button>
            `}
        </div>
      </td>
    </tr>`;
  }).join('');
}

/* ===== 弹窗 ===== */
function openModal(id) { document.getElementById('modal-' + id).classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeModal(id) {
  document.getElementById('modal-' + id).classList.remove('active');
  if (!document.querySelector('.modal-overlay.active')) document.body.style.overflow = '';
}

function setRoleChips(roles) {
  document.querySelectorAll('#f-role-chips .chip').forEach(chip => {
    const input = chip.querySelector('input');
    input.checked = roles.includes(input.value);
    chip.classList.toggle('checked', input.checked);
  });
}
function getSelectedRoles() {
  return Array.from(document.querySelectorAll('#f-role-chips input:checked')).map(i => i.value);
}

function openCreateModal() {
  editingId = null;
  document.getElementById('user-modal-title').textContent = '新增用户';
  document.getElementById('user-submit-btn').textContent = '创建用户';
  document.getElementById('f-username').value = '';
  document.getElementById('f-username').readOnly = false;
  document.getElementById('f-email').value = '';
  document.getElementById('f-password').value = '';
  document.getElementById('password-group').style.display = '';
  setRoleChips(['普通用户']);
  openModal('user');
}

function openEditModal(id) {
  const u = users.find(x => x.id === id);
  if (!u) return;
  editingId = id;
  document.getElementById('user-modal-title').textContent = `编辑用户 — ${u.username}`;
  document.getElementById('user-submit-btn').textContent = '保存修改';
  document.getElementById('f-username').value = u.username;
  document.getElementById('f-username').readOnly = true;  // 用户名不可改
  document.getElementById('f-email').value = u.email;
  document.getElementById('f-password').value = '';
  document.getElementById('password-group').style.display = 'none';  // 编辑不改密码
  setRoleChips(u.roles);
  openModal('user');
}

function submitUser() {
  const username = document.getElementById('f-username').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const password = document.getElementById('f-password').value;
  const roles = getSelectedRoles();

  if (!username) { toast('请填写用户名', 'error'); return; }
  if (!/^[a-zA-Z][a-zA-Z0-9_]{1,49}$/.test(username)) { toast('用户名需以字母开头，仅含字母/数字/下划线，2-50 位', 'error'); return; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('请填写有效的邮箱地址', 'error'); return; }
  if (!editingId && password.length < 8) { toast('初始密码至少 8 位', 'error'); return; }
  if (roles.length === 0) { toast('请至少分配一个角色', 'error'); return; }

  if (editingId) {
    const u = users.find(x => x.id === editingId);
    if (u.email !== email && users.some(x => x.email === email)) { toast('该邮箱已被使用', 'error'); return; }
    u.email = email;
    u.roles = roles;
    closeModal('user');
    render();
    toast(`已更新用户「${u.username}」`);
  } else {
    if (users.some(x => x.username === username)) { toast('该用户名已存在', 'error'); return; }
    if (users.some(x => x.email === email)) { toast('该邮箱已被使用', 'error'); return; }
    const newUser = {
      id: Math.max(...users.map(x => x.id)) + 1,
      username, email, roles,
      status: 'active',
      lastLogin: '—',
      superuser: false,
    };
    users.unshift(newUser);
    closeModal('user');
    currentPage = 1;
    document.getElementById('search').value = '';
    document.getElementById('role-filter').value = '';
    document.getElementById('status-filter').value = '';
    render();
    toast(`已创建用户「${username}」`);
  }
}

/* ===== 重置密码 ===== */
function openPasswordModal(id) {
  const u = users.find(x => x.id === id);
  if (!u) return;
  resettingId = id;
  document.getElementById('pw-username').textContent = u.username;
  document.getElementById('f-new-password').value = '';
  document.getElementById('f-confirm-password').value = '';
  openModal('password');
}
function submitPassword() {
  const p1 = document.getElementById('f-new-password').value;
  const p2 = document.getElementById('f-confirm-password').value;
  if (p1.length < 8) { toast('新密码至少 8 位', 'error'); return; }
  if (p1 !== p2) { toast('两次输入的密码不一致', 'error'); return; }
  const u = users.find(x => x.id === resettingId);
  closeModal('password');
  toast(`已重置「${u.username}」的密码`);
}

/* ===== 行操作 ===== */
function toggleStatus(id) {
  const u = users.find(x => x.id === id);
  if (!u) return;
  u.status = u.status === 'active' ? 'disabled' : 'active';
  render();
  toast(u.status === 'active' ? `已启用「${u.username}」` : `已禁用「${u.username}」`);
}
function deleteUser(id) {
  const u = users.find(x => x.id === id);
  if (!u) return;
  if (!confirm(`确认删除用户「${u.username}」吗？删除后不可恢复。`)) return;
  users = users.filter(x => x.id !== id);
  render();
  toast(`已删除用户「${u.username}」`);
}

/* ===== 事件绑定 ===== */
document.getElementById('search').addEventListener('input', () => { currentPage = 1; render(); });
document.getElementById('role-filter').addEventListener('change', () => { currentPage = 1; render(); });
document.getElementById('status-filter').addEventListener('change', () => { currentPage = 1; render(); });
document.getElementById('prev-btn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; render(); } });
document.getElementById('next-btn').addEventListener('click', () => { const p = Math.ceil(filtered.length / PAGE_SIZE) || 1; if (currentPage < p) { currentPage++; render(); } });

// 角色 chip 点击
document.querySelectorAll('#f-role-chips .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const input = chip.querySelector('input');
    if (input.disabled) return;
    input.checked = !input.checked;
    chip.classList.toggle('checked', input.checked);
  });
});
// 点击遮罩关闭
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) { el.classList.remove('active'); if (!document.querySelector('.modal-overlay.active')) document.body.style.overflow = ''; } });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.querySelectorAll('.modal-overlay.active').forEach(el => { el.classList.remove('active'); }); document.body.style.overflow = ''; } });

render();

// 支持通过 ?create=1 自动打开新增弹窗（用于截图/演示）
if (new URLSearchParams(window.location.search).get('create') === '1') openCreateModal();
</script>
</body>
</html>
