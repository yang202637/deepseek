<style>
/* Layout Design Spec Based System */
:root {
  --sidebar-dark: #0F172A;
  --sidebar-text: #CBD5E1;
  --sidebar-active: #2563EB;
  --main-bg: #F1F5F9;
  --card: #FFFFFF;
  --border: #E2E8F0;
  --text: #1E293B;
  --text-muted: #64748B;
  --accent: #2563EB;
  --accent-light: #DBEAFE;
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --radius-lg: 8px;
  --radius-md: 6px;
  --radius-sm: 4px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--main-bg);color:var(--text);line-height:1.6}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{cursor:pointer;border:none;background:none;font:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-dark);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-header{height:64px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #1E293B}
.sidebar-header .logo{display:flex;align-items:center;font-size:20px;font-weight:700;color:white}
.sidebar-header .icon{margin-right:10px;fill:var(--accent);width:20px;height:20px}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto}
.group-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);padding:6px 12px;margin-top:16px}
.sidebar-nav a{display:flex;align-items:center;padding:10px 16px;margin:2px 6px;border-radius:var(--radius-lg);color:var(--sidebar-text);font-size:14px;font-weight:500;transition:all .15s}
.sidebar-nav a:hover{background:#1E2A3B}
.sidebar-nav a.active{background:var(--sidebar-active);color:#fff}
.sidebar-nav a.active .icon{margin-right:10px;fill:#fff}
.sidebar-nav .icon{fill:var(--sidebar-text);margin-right:10px;width:16px;height:16px}
.sidebar-user{height:64px;border-top:1px solid #1E293B;padding:0 20px;display:flex;align-items:center}
.sidebar-user .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:13px}
.sidebar-user .meta{margin-left:12px}
.sidebar-user .name{font-size:14px;font-weight:600;color:#fff}
.sidebar-user .email{font-size:12px;color:var(--sidebar-text)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px}
.header .path{display:flex;align-items:center;font-size:13px}
.header .path a:not(:last-child){color:var(--text-muted)}
.header .path a:last-child{font-weight:600;color:var(--text)}
.header .path a:not(:last-child)::after{content:'/';margin:0 8px;color:var(--border)}
.content{flex:1;overflow-y:auto;padding:24px}
.page{max-width:1200px;margin:0 auto;width:100%}
.page h1{font-size:24px;font-weight:700;margin-bottom:4px}
.page .subtitle{color:var(--text-muted);font-size:14px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.stat .label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:6px}
.stat .value{font-size:24px;font-weight:700}
.stat .trend{font-size:12px;color:var(--success)}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px}
.table-card h2{font-size:18px;font-weight:600;margin-bottom:16px}
.table-card .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.table-card .toolbar .left{display:flex;align-items:center;gap:8px}
.table-card .toolbar input{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-md);width:280px;font-size:14px;outline:none}
.table-card .toolbar input:focus{border-color:var(--accent)}
.toolbar-filters{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar-filters .filter{border:1px solid var(--border);border-radius:var(--radius-md);padding:6px 12px;font-size:13px;background:var(--card);cursor:pointer}
.toolbar-filters .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:#F1F5F9;color:#374151;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left}
th{text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);padding:12px 12px 8px;border-bottom:2px solid var(--border)}
td{vertical-align:top}
tr:hover{background:#F8FAFC}
tr td:first-child{font-weight:500}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
.badge.default-bg{background:#F1F5F9;color:#374151}
.badge.success-bg{background:#DCFCE7;color:#166534}
.badge.warning-bg{background:#FEF9C3;color:#854D0E}
.badge.danger-bg{background:#FEE2E2;color:#991B1B}
.actions button{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:4px;color:var(--text-muted);transition:background .15s}
.actions button:hover{background:#F1F5F9}
.actions button.primary{background:var(--accent);color:#fff}
.actions button.primary:hover{background:#1D4ED8}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;color:var(--text-muted);font-size:13px}
.pagination .left span{margin-right:8px}
.pagination .right{display:flex;align-items:center;gap:6px}
.pagination button{border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px;font-size:13px;background:var(--card)}
.pagination button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pagination button:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.sidebar{width:64px}.sidebar-header .logo span,.sidebar-nav .group-title,.sidebar-user .meta{display:none}.sidebar-nav a{width:48px;justify-content:center;padding:12px;margin:2px 0}.sidebar-nav a.active .icon{margin:0}.sidebar-nav .icon{margin:0}.sidebar-user{padding:12px}.sidebar-user .avatar{width:32px}}

const PAGE_SIZE = 20;
let current = 1;
let filtered = [];

const statusMap = {completed:['已完成','success-bg'],active:['进行中','warning-bg'],error:['异常','danger-bg']};
const satisfactionMap = {positive:['满意','success-bg'],negative:['不满意','danger-bg'],none:['未评价','default-bg']};
const annotationMap = {true:['已标注','success-bg'],false:['未标注','default-bg']};

function statusBadge(s){const m=statusMap[s]||['未知','default-bg'];return `<span class="badge ${m[1]}">${m[0]}</span>`;}
function satisfactionBadge(s){const m=satisfactionMap[s]||['未评价','default-bg'];return `<span class="badge ${m[1]}">${m[0]}</span>`;}
function annotationBadge(a){const m=annotationMap[a]||['未标注','default-bg'];return `<span class="badge ${m[1]}">${m[0]}</span>`;}
function formatTime(ms){const s=Math.floor(ms/1000);return s+'s';}
function formatCost(c){return '¥'+c.toFixed(2);}

function renderStats(){
  document.getElementById('stat-total').textContent=conversations.length;
  const avgTurns=conversations.reduce((s,c)=>s+c.turns,0)/conversations.length;
  document.getElementById('stat-turns').textContent=avgTurns.toFixed(1)+'轮';
  const avgTime=conversations.reduce((s,c)=>s+c.time,0)/conversations.length;
  document.getElementById('stat-duration').textContent=avgTime.toFixed(1)+'s';
  const satisfied=conversations.filter(c=>c.satisfaction==='positive').length/conversations.filter(c=>c.satisfaction!=='none').length;
  document.getElementById('stat-satisfaction').textContent=(satisfied*100).toFixed(0)+'%';
}

function doFilter(){
  const term=document.getElementById('search').value.toLowerCase();
  const agentF=document.getElementById('agentFilter').value;
  const statusF=document.getElementById('statusFilter').value;
  const timeF=document.getElementById('timeFilter').value;
  const satF=document.getElementById('satisfactionFilter').value;
  filtered=conversations.filter(c=>{
    const matchTerm=c.id.toLowerCase().includes(term)||c.agent.toLowerCase().includes(term)||c.user.toLowerCase().includes(term);
    const matchAgent=agentF==='all'||c.agent===agentF;
    const matchStatus=statusF==='all'||c.status===statusF;
    const matchSat=satF==='all'||c.satisfaction===satF;
    return matchTerm&&matchAgent&&matchStatus&&matchSat;
  });
  current=1;
  renderTable();
}

function renderTable(){
  const tbody=document.querySelector('#conv-table tbody');
  const start=(current-1)*PAGE_SIZE;
  const end=start+PAGE_SIZE;
  const page=filtered.slice(start,end);
  document.getElementById('total-count').textContent=filtered.length;
  const totalPages=Math.ceil(filtered.length/PAGE_SIZE)||1;
  document.getElementById('page-info').textContent=`${current} / ${totalPages}`;
  document.getElementById('prev').disabled=current<=1;
  document.getElementById('next').disabled=current>=totalPages;
  tbody.innerHTML=page.map(c=>`<tr>
    <td class="font-mono" style="font-size:12px">${c.id}</td>
    <td>${c.agent}</td>
    <td>${c.user}</td>
    <td>${c.turns}</td>
    <td>${statusBadge(c.status)}</td>
    <td>${c.tokens.toLocaleString()}</td>
    <td>${formatTime(c.time)}</td>
    <td>${satisfactionBadge(c.satisfaction)}</td>
    <td>${annotationBadge(c.annotated)}</td>
    <td>${c.start}</td>
    <td class="actions">
      <button title="查看详情">🔍</button>
      <button title="标注">🏷</button>
      <button class="primary" title="导出">📤</button>
    </td>
  </tr>`).join('');
}

document.getElementById('prev').onclick=()=>{if(current>1){current--;renderTable();}};
document.getElementById('next').onclick=()=>{const tp=Math.ceil(filtered.length/PAGE_SIZE)||1;if(current<tp){current++;renderTable();}};
document.getElementById('search').addEventListener('input',doFilter);
document.getElementById('agentFilter').addEventListener('change',doFilter);
document.getElementById('statusFilter').addEventListener('change',doFilter);
document.getElementById('timeFilter').addEventListener('change',doFilter);
document.getElementById('satisfactionFilter').addEventListener('change',doFilter);
document.getElementById('exportBtn').onclick=()=>{alert('导出功能开发中');};

renderStats();
doFilter();
</script>
