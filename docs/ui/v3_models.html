<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>辰光 Agent - 模型管理</title>
<style>
/* Layout Design Spec Based System */
:root {
  --sidebar-dark: #0F172A;
  --sidebar-text: #CBD5E1;
  --sidebar-active: #2563EB;
  --main-bg: #F1F5F9;
  --card: #FFFFFF;
  --border: #E2E8F0;
  --text: #1E293B;
  --text-muted: #64748B;
  --accent: #2563EB;
  --accent-light: #DBEAFE;
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
  --radius-lg: 8px;
  --radius-md: 6px;
  --radius-sm: 4px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--main-bg);
  color: var(--text);
  line-height: 1.6;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { cursor: pointer; border: none; background: none; font: inherit; }

/* Layout Structure */
.app {
  display: flex;
  min-height: 100vh;
}

/* Sidebar Navigation */
.sidebar {
  width: 240px;
  background: var(--sidebar-dark);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-header {
  height: 64px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid #1E293B;
}

.sidebar-header .logo {
  display: flex;
  align-items: center;
  font-size: 20px;
  font-weight: 700;
  color: white;
}

.sidebar-header .icon {
  margin-right: 10px;
  fill: var(--accent);
  width: 20px;
  height: 20px;
}

.sidebar-nav {
  flex: 1;
  padding: 16px 12px;
  overflow-y: auto;
}

.group-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  padding: 6px 12px;
  margin-top: 16px;
}

.sidebar-nav a {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  margin: 2px 6px;
  border-radius: var(--radius-lg);
  color: var(--sidebar-text);
  font-size: 14px;
  font-weight: 500;
  transition: all 0.15s;
}

.sidebar-nav a:hover {
  background: #1E2A3B;
}

.sidebar-nav a.active {
  background: var(--sidebar-active);
  color: white;
}

.sidebar-nav a.active .icon {
  margin-right: 10px;
  fill: white;
}

.sidebar-nav .icon {
  fill: var(--sidebar-text);
  margin-right: 10px;
  width: 16px;
  height: 16px;
}

.sidebar-user {
  height: 64px;
  border-top: 1px solid #1E293B;
  padding: 0 20px;
  display: flex;
  align-items: center;
}

.sidebar-user .avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-weight: 700;
  font-size: 13px;
}

.sidebar-user .meta {
  margin-left: 12px;
}

.sidebar-user .name {
  font-size: 14px;
  font-weight: 600;
  color: white;
}

.sidebar-user .email {
  font-size: 12px;
  color: var(--sidebar-text);
}

/* Main Content */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  height: 56px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
}

.header .path {
  display: flex;
  align-items: center;
  font-size: 13px;
}

.header .path a:not(:last-child) {
  color: var(--text-muted);
}

.header .path a:last-child {
  font-weight: 600;
  color: var(--text);
}

.header .path a:not(:last-child)::after {
  content: '/';
  margin: 0 8px;
  color: var(--border);
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.page {
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}

.page h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}

.page .subtitle {
  color: var(--text-muted);
  font-size: 14px;
  margin-bottom: 20px;
}

/* Stats Cards */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
}

.stat .label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.stat .value {
  font-size: 24px;
  font-weight: 700;
}

/* Tables */
.table-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 24px;
}

.table-card h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
}

.table-card .toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.table-card .toolbar .left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.table-card .toolbar input {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  width: 280px;
  font-size: 14px;
  outline: none;
}

.table-card .toolbar input:focus {
  border-color: var(--accent);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--accent);
  color: white;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 500;
  transition: background 0.15s;
}

.btn-primary:hover {
  background: #1D4ED8;
}

.btn-outline {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: white;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 500;
  transition: background 0.15s;
}

.btn-outline:hover {
  background: #F8FAFC;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}

th {
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  padding: 12px 12px 8px;
  border-bottom: 2px solid var(--border);
}

td {
  vertical-align: top;
}

tbody tr:hover {
  background: #F8FAFC;
}

tbody tr td:first-child {
  font-weight: 500;
}

.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
}

.badge.default-bg {
  background: #F1F5F9;
  color: #374151;
}

.badge.success-bg {
  background: #DCFCE7;
  color: #166534;
}

.badge.warning-bg {
  background: #FEF9C3;
  color: #854D0E;
}

.badge.danger-bg {
  background: #FEE2E2;
  color: #991B1B;
}

.badge.outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
}

.actions button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 4px;
  color: var(--text-muted);
  transition: background 0.15s;
}

.actions button:hover {
  background: #F1F5F9;
}

.actions button.primary {
  background: var(--accent);
  color: white;
}

.actions button.primary:hover {
  background: #1D4ED8;
}

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  color: var(--text-muted);
  font-size: 13px;
}

.pagination .right {
  display: flex;
  align-items: center;
  gap: 6px;
}

.pagination button {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 10px;
  font-size: 13px;
  background: var(--card);
}

.pagination button.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.pagination button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Responsive */
@media (max-width: 768px) {
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .sidebar {
    width: 64px;
  }

  .sidebar-header .logo span,
  .sidebar-nav .group-title,
  .sidebar-user .meta {
    display: none;
  }

  .sidebar-nav a {
    width: 48px;
    justify-content: center;
    padding: 12px;
    margin: 2px 0;
  }

  .sidebar-nav a.active .icon {
    margin: 0;
  }

  .sidebar-nav .icon {
    margin: 0;
  }

  .sidebar-user {
    padding: 12px;
  }

  .sidebar-user .avatar {
    width: 32px;
  }
}
</style>
</head>

            <div class="label">模型总数</div>

          <div class="stat">

            </div>
            <button class="btn-primary" onclick="alert('添加模型弹窗')">

<script>
const PAGE_SIZE = 5;
let current = 1, filtered = [];

const models = [
  {name:'GPT-4o', id:'gpt-4o', provider:'OpenAI', caps:['chat','vision','function_calling'], context:128000, inputPrice:'$2.50', outputPrice:'$10.00', status:'available'},
  {name:'GPT-4o-mini', id:'gpt-4o-mini', provider:'OpenAI', caps:['chat','vision'], context:128000, inputPrice:'$0.15', outputPrice:'$0.60', status:'available'},
  {name:'GPT-3.5-turbo', id:'gpt-3.5-turbo', provider:'OpenAI', caps:['chat'], context:16385, inputPrice:'$0.50', outputPrice:'$1.50', status:'available'},
  {name:'Claude-3.5-Sonnet', id:'claude-3-5-sonnet', provider:'Anthropic', caps:['chat','vision','function_calling','long_context'], context:200000, inputPrice:'$3.00', outputPrice:'$15.00', status:'available'},
  {name:'Claude-3-Haiku', id:'claude-3-haiku', provider:'Anthropic', caps:['chat','vision'], context:200000, inputPrice:'$0.25', outputPrice:'$1.25', status:'available'},
  {name:'Qwen-72B-Chat', id:'qwen-72b-chat', provider:'阿里云', caps:['chat','function_calling'], context:32768, inputPrice:'¥20', outputPrice:'¥20', status:'available'},
  {name:'Qwen-14B-Chat', id:'qwen-14b-chat', provider:'阿里云', caps:['chat'], context:32768, inputPrice:'¥8', outputPrice:'¥8', status:'available'},
  {name:'Llama-3-70B', id:'llama-3-70b', provider:'本地部署', caps:['chat','function_calling'], context:8192, inputPrice:'免费', outputPrice:'免费', status:'available'},
];

function statusBadge(s) {
  const map = {
    available: ['可用', 'success-bg'],
    unavailable: ['不可用', 'default-bg'],
    rate_limited: ['限流中', 'danger-bg']
  };
  const [label, cls] = map[s] || ['草稿', 'warning-bg'];
  return `<span class="badge ${cls}">${label}</span>`;
}

function render() {
  const tbody = document.querySelector('#model-table tbody');
  const term = document.getElementById('search').value.toLowerCase();
  filtered = models.filter(m => m.name.toLowerCase().includes(term) || m.provider.includes(term));
  current = Math.min(current, Math.ceil(filtered.length / PAGE_SIZE) || 1);
  const start = (current - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);
  document.getElementById('total-count').textContent = filtered.length;
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
  document.getElementById('page-info').textContent = `${current} / ${totalPages}`;
  document.getElementById('prev-btn').disabled = current <= 1;
  document.getElementById('next-btn').disabled = current >= totalPages;
  tbody.innerHTML = page.map(m => `<tr>
    <td>
      <div>${m.name}</div>
      <div style="font-size:12px;color:var(--text-muted);font-family:monospace">${m.id}</div>
    </td>
    <td>${m.provider}</td>
    <td>${m.caps.map(c => `<span class="badge outline" style="margin:1px">${c}</span>`).join('')}</td>
    <td>${m.context.toLocaleString()}</td>
    <td style="font-size:12px">${m.inputPrice}/in<br>${m.outputPrice}/out</td>
    <td>${statusBadge(m.status)}</td>
    <td class="actions">
      <button title="测试">🔍</button>
      <button title="编辑">✏</button>
      <button title="删除" style="color:var(--danger)">🗑</button>
    </td>
  </tr>`).join('');
}

document.getElementById('search').addEventListener('input', () => { current = 1; render(); });
document.getElementById('prev-btn').onclick = () => { if(current > 1){ current--; render(); } };
document.getElementById('next-btn').onclick = () => { const p = Math.ceil(filtered.length/PAGE_SIZE)||1; if(current < p){ current++; render(); } };
render();
</script>
</body>
